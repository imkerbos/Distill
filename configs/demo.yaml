server:
  addr: ":10100"
  read_timeout: 10s
  write_timeout: 20s
  shutdown_timeout: 15s

auth:
  session_ttl: 8h
  users:
    # 本地 demo 凭据：admin / admin123。明文只应出现在这条注释和 README 里 ——
    # 这套账号仅用于 fixture 数据的本地演示，不得随配置进入任何真实环境。
    - username: admin
      password_hash: "$2a$10$xoVvLW2pGWd/EStkHBl31OzDnxv9ImRRRPUT5vFSHRDQxiSCoRV1u"

database:
  # 本地 demo 连 compose 网络内的 mysql。真实部署用环境变量
  # DISTILL_DATABASE__DSN 覆盖，凭据不写进仓库。
  #
  # 这条 DSN 刻意不带 multiStatements=true：那是迁移专用连接的能力
  # （见 mysqlregistry.migrationDSN），运行时连接池开着它只会把任何
  # 一次注入的影响面从单条语句放大成任意语句链。
  dsn: "root:distill-local@tcp(mysql:3306)/distill?parseTime=true&loc=UTC"

log:
  level: INFO

# secrets / gitverify 两段在 demo 里刻意留空：不解析凭据，也就不做 Git
# 绑定校验，界面上结论一律是 NOT_VERIFIED。这不是"暂时没开"，而是一个
# 说得出口的状态 —— 没做过的检查不是通过了的检查。
#
# 打开校验需要两段一起配（少一段启动即失败，见 config.validateVerification）：
#
# secrets:
#   project: distill-prod          # 将来的 Secret Manager 解析器用
#   prefix: distill-git-           # 短名拼进资源路径前的固定前缀
#   dir: /run/secrets/distill      # 本地开发用的目录解析器；该目录必须 gitignored
# gitverify:
#   timeout: 10s                   # 出站超时，超时归入 REPO_UNREACHABLE
#   host_keys: |                   # known_hosts 格式；公钥不是机密，与凭据分开存放
#     gitlab.example.com ssh-ed25519 AAAA...
