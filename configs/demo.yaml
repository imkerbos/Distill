server:
  addr: ":10100"
  read_timeout: 10s
  write_timeout: 20s
  shutdown_timeout: 15s

auth:
  session_ttl: 8h
  users:
    # 本地 demo 凭据：admin / admin123。明文只应出现在这条注释和 README 里 ——
    # 这套账号仅用于 fixture 数据的本地演示，不得随配置进入任何真实环境。
    - username: admin
      password_hash: "$2a$10$xoVvLW2pGWd/EStkHBl31OzDnxv9ImRRRPUT5vFSHRDQxiSCoRV1u"

database:
  # 本地 demo 连 compose 网络内的 mysql。真实部署用环境变量
  # DISTILL_DATABASE__DSN 覆盖，凭据不写进仓库。
  #
  # 这条 DSN 刻意不带 multiStatements=true：那是迁移专用连接的能力
  # （见 mysqlregistry.migrationDSN），运行时连接池开着它只会把任何
  # 一次注入的影响面从单条语句放大成任意语句链。
  dsn: "root:distill-local@tcp(mysql:3306)/distill?parseTime=true&loc=UTC"

log:
  level: INFO
