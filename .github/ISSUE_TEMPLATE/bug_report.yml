name: Bug 报告
description: 行为与预期不符
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **请不要粘贴真实集群标识、kubeconfig、agent token 或生产数据。**
        用占位符替换即可 —— 复现不需要它们。
  - type: dropdown
    id: component
    attributes:
      label: 组件
      options:
        - distill-api
        - distill-collector
        - distill-agent
        - web 前端
        - 求值引擎 (internal/replay)
        - 不确定
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / commit
      placeholder: main @ abc1234
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为与实际行为
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 能落成一个失败测试最好 —— 修 bug 的第一步就是写它。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 输出
      description: 带 request_id 的那几行最有用。脱敏后贴。
      render: text
