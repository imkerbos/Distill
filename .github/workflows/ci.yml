name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: distill-local
          MYSQL_DATABASE: distill
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pdistill-local"
          --health-interval=3s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest

      - name: Test
        env:
          DISTILL_TEST_MYSQL_DSN: "root:distill-local@tcp(127.0.0.1:3306)/distill?parseTime=true&loc=UTC"
        run: go test ./... -race -count=1
