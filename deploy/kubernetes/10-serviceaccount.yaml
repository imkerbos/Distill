apiVersion: v1
kind: ServiceAccount
metadata:
  name: distill-api
  namespace: distill
# **这里没有 Role，也没有 RoleBinding，这是刻意的。**
#
# distill-api 不读写任何 Kubernetes 对象 —— 它的数据在 MySQL 里，策略下发走
# GitOps。给它任何 RBAC 都是设计错误，不是权限配置问题（docs/security-model.md）。
# 将来如果有人为了"顺手看一眼集群"给它加一条 Role，那条 Role 就是平台开始
# 持有集群权限的第一步。
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: distill-collector
  namespace: distill
# collector 同样不需要**本集群**的权限：它连的是被管集群，用的是从凭据后端
# 读出来的那份只读 kubeconfig。这个 SA 只是个身份，不绑任何 Role。
#
# 例外：凭据后端选 GCP Secret Manager 时，这个 SA 要与一个 GCP 服务账号做
# Workload Identity 绑定，权限限定为那个 prefix 下的 secretAccessor。
automountServiceAccountToken: false
