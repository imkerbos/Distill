# **示例，不要直接 apply。** 真实凭据不进 Git —— 用 External Secrets、
# Sealed Secrets 或部署时 kubectl create secret 生成。
#
#   kubectl -n distill create secret generic distill-api-secrets \
#     --from-literal=DISTILL_DATABASE__DSN='user:pass@tcp(mysql:3306)/distill?parseTime=true&loc=UTC' \
#     --from-literal=DISTILL_AUTH__BOOTSTRAP_USER__USERNAME='admin' \
#     --from-literal=DISTILL_AUTH__BOOTSTRAP_USER__PASSWORD_HASH='$2a$10$...'
#
# 环境变量名到配置键的映射：前缀 DISTILL_ 去掉，双下划线变成点，全小写。
# DISTILL_DATABASE__DSN -> database.dsn（internal/config）。
apiVersion: v1
kind: Secret
metadata:
  name: distill-api-secrets
  namespace: distill
type: Opaque
stringData:
  # DSN 必须带 parseTime=true 与 loc=UTC：缺前者时 DATETIME 以 []byte 读出，
  # 缺后者时驱动按本地时区解释 —— 两者都让时间列静默错位，而错位的审计时间
  # 在复盘时毫无价值。
  #
  # 刻意不带 multiStatements=true：那是迁移专用连接的能力，运行时开着它只会
  # 把一次注入的影响面从单条语句放大成任意语句链。
  DISTILL_DATABASE__DSN: "REPLACE_ME"
  DISTILL_AUTH__BOOTSTRAP_USER__USERNAME: "admin"
  # bcrypt hash。明文密码永远不进配置，也不进这里。
  DISTILL_AUTH__BOOTSTRAP_USER__PASSWORD_HASH: "REPLACE_ME"
